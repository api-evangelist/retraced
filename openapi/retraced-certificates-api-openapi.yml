openapi: 3.2.0
info:
  title: Public API Reference Certificates API
  description: 'The retraced API comprises all publicly enabled options to make

    machine-to-machine changes in the retraced platform.'
  version: 2.938.1
servers: []
tags:
- name: Certificates
paths:
  /api/v2/certificates/:
    get:
      tags:
