          type: string
          minLength: 1
        in: path
        name: id
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      success:
                        default: true
                        type: boolean
                    required:
                    - success
                    additionalProperties: false
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                      name:
                        type: string
                        minLength: 1
                      type:
                        type: string
                        enum:
                        - MEMBERSHIP
                        - PRODUCT
                        - TRANSACTION
                        - COMPANY
                        - SCOPE
                      companyId:
                        type: string
                        minLength: 1
                      companyName:
                        anyOf:
                        - type: string
                          minLength: 1
                        - type: 'null'
                      companyOfficialName:
                        anyOf:
                        - type: string
                          minLength: 1
                        - type: 'null'
                      documentNumber:
                        anyOf:
                        - type: string
                          minLength: 1
                        - type: 'null'
                      licenseNumber:
                        anyOf:
                        - type: string
                          minLength: 1
                        - type: 'null'
                      issueDate:
                        anyOf:
                        - anyOf:
                          - type: string
                          - type: string
                            format: date-time
                        - type: 'null'
                      issuedBy:
                        anyOf:
                        - type: string
                        - type: 'null'
                      expirationDate:
                        anyOf:
                        - anyOf:
                          - type: string
                          - type: string
                            format: date-time
                        - type: 'null'
                      explanation:
                        anyOf:
                        - type: string
                        - type: 'null'
                      status:
                        type: string
                        enum:
                        - DRAFT
                        - REQUESTED
                        - APPROVED
                        - REJECTED
                        - ACKNOWLEDGED
                        - NOT_VERIFIABLE
                      fileUrl:
                        anyOf:
                        - type: string
                          minLength: 1
                          maxLength: 255
                        - type: 'null'
                      fileContentType:
                        anyOf:
                        - type: string
                          minLength: 1
                        - type: 'null'
                    required:
                    - id
                    - name
                    - type
                    - companyId
                    - status
                    additionalProperties: false
                required:
                - metadata
                - data
                additionalProperties: false
        '403':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      success:
                        default: false
                        type: boolean
                    required:
                    - success
                    additionalProperties: false
                  statusCode:
                    type: number
                  code:
                    type: string
                  error:
                    type: string
                  message:
                    type: string
                  expected:
                    type: boolean
                required:
                - statusCode
                - code
                - message
                additionalProperties: false
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      success:
                        default: false
                        type: boolean
                    required:
                    - success
                    additionalProperties: false
                  statusCode:
                    type: number
                  code:
                    type: string
                  error:
                    type: string
                  message:
                    type: string
                  expected:
                    type: boolean
                required:
                - statusCode
                - code
                - message
                additionalProperties: false
