openapi: 3.0.3
info:
  title: Public API Reference Certificates API
  description: 'The retraced API comprises all publicly enabled options to make

    machine-to-machine changes in the retraced platform. The retraced dashboard uses the

    same endpoints, but also in addition more. If you wish to use the API of the dashboard,

    it is possible but not versioned cleanly like the public API.


    ## Authentication


    The authentication procedure is passwordless and uses an API key in the header. To get

    an API key log into the Retraced Platform and navigate to **Developers HQ > API Keys**

    then click **Create**. Be sure to copy the key somewhere safe, as you won''t be able to

    view it again. If you don''t see Developers HQ in the sidebar contact your Customer

    Success Manager to enable this for you. You can now set the key directly in request

    headers. To authenticate using an API key, set the header key `companyapikey` to the

    value of your API key.


    ## Getting Started


    Retraced has 2 environments against which you can send your requests and receive the

    expected response: staging (for development and testing) and production. Your API key

    is scoped for both environments. The staging Base URL is

    https://publicapi.staging.retraced.com. Staging copies production data once daily, and

    all changes made on staging will be deleted.


    Find detailed guides on how to use the endpoints and how we recommend building an

    integration given your use case in our

    [guides](https://publicapi.retraced.com/api/v2/guides). A history of public API

    changes is available in the

    [release notes](https://publicapi.retraced.com/api/v2/release-notes).'
  version: 2.938.1
servers: []
tags:
- name: Certificates
paths:
  /api/v2/certificates/:
    get:
      tags:
      - Certificates
      description: List certificates
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 500
        in: query
        name: limit
        required: false
      - schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        in: query
        name: page
        required: false
      - schema:
          default: desc
          type: string
          enum:
          - asc
          - desc
          - ASC
          - DESC
        in: query
        name: order
        required: false
      - schema:
          default: name
          type: string
          enum:
          - name
          - companyName
          - status
          - updatedAt
          - expirationDate
          - type
          - documentNumber
          - licenseNumber
          - issueDate
          - issuedBy
        in: query
        name: sort
        required: false
      - schema:
          type: string
        in: query
        name: status
        required: false
      - schema:
          type: string
        in: query
        name: type
        required: false
      - schema:
          type: string
        in: query
        name: companyId
        required: false
      - schema:
          type: string
        in: query
        name: standardId
        required: false
      - schema:
          type: string
        in: query
        name: filter
        required: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      success:
                        default: true
                        type: boolean
                      pagination:
                        type: object
                        properties:
                          page:
                            default: 1
                            type: number
                          limit:
                            default: 10
                            type: number
                          total:
                            default: 0
                            type: number
                          totalPages:
                            default: 0
                            type: number
                        required:
                        - page
                        - limit
                        - total
                        - totalPages
                        additionalProperties: false
                    required:
                    - success
                    additionalProperties: false
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                        name:
                          type: string
                          minLength: 1
                        type:
                          type: string
                          enum:
                          - MEMBERSHIP
                          - PRODUCT
                          - TRANSACTION
                          - COMPANY
                          - SCOPE
                        companyId:
                          type: string
                          minLength: 1
                        companyName:
                          anyOf:
                          - type: string
                            minLength: 1
                          - type: 'null'
                        companyOfficialName:
                          anyOf:
                          - type: string
                            minLength: 1
                          - type: 'null'
                        documentNumber:
                          anyOf:
                          - type: string
                            minLength: 1
                          - type: 'null'
                        licenseNumber:
                          anyOf:
                          - type: string
                            minLength: 1
                          - type: 'null'
                        issueDate:
                          anyOf:
                          - anyOf:
                            - type: string
                            - type: string
                              format: date-time
                          - type: 'null'
                        issuedBy:
                          anyOf:
                          - type: string
                          - type: 'null'
                        expirationDate:
                          anyOf:
                          - anyOf:
                            - type: string
                            - type: string
                              format: date-time
                          - type: 'null'
                        explanation:
                          anyOf:
                          - type: string
                          - type: 'null'
                        status:
                          type: string
                          enum:
                          - DRAFT
                          - REQUESTED
                          - APPROVED
                          - REJECTED
                          - ACKNOWLEDGED
                          - NOT_VERIFIABLE
                        fileUrl:
                          anyOf:
                          - type: string
                            minLength: 1
                            maxLength: 255
                          - type: 'null'
                        fileContentType:
                          anyOf:
                          - type: string
                            minLength: 1
                          - type: 'null'
                      required:
                      - id
                      - name
                      - type
                      - companyId
                      - status
                      additionalProperties: false
                required:
                - metadata
                - data
                additionalProperties: false
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      success:
                        default: false
                        type: boolean
                    required:
                    - success
                    additionalProperties: false
                  statusCode:
                    type: number
                  code:
                    type: string
                  error:
                    type: string
                  message:
                    type: string
                  expected:
                    type: boolean
                required:
                - statusCode
                - code
                - message
                additionalProperties: false
  /api/v2/certificates/{id}:
    get:
      tags:
      - Certificates
      description: Get certificate by ID
