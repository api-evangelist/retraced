openapi: 3.2.0
info:
  title: Public API Reference Product / Style Types API
  description: 'The retraced API comprises all publicly enabled options to make

    machine-to-machine changes in the retraced platform.'
  version: 2.938.1
servers: []
tags:
- name: Product / Style Types
paths:
  /api/v2/style-types/:
    get:
      tags:
      - Product / Style Types
      description: Returns a paginated list of style types configured for the account. Style types define the taxonomy used to classify styles — for example TSHIRTS, JEANS, OUTDOOR_JACKETS — and are organised in a hierarchy via parentId and hierarchyLevel. The id returned for each style type is the value to pass in the styleTypeId field when creating or updating a style via POST /api/v2/styles/. Use this endpoint to discover valid styleTypeId values before creating styles, as passing an unrecognised value will result in an error. Filter by hierarchyLevel to retrieve only top-level categories or leaf nodes, or by parentId to retrieve the children of a specific type.
      parameters:
      - schema:
          default: 1
          type: integer
          minimum: 1
          maximum: 9007199254740991
        in: query
        name: page
        required: false
      - schema:
          default: 20
          type: integer
          minimum: 1
          maximum: 100
        in: query
        name: limit
        required: false
      - schema:
          default: name
          type: string
          enum:
          - name
          - createdAt
          - updatedAt
        in: query
        name: sort
        required: false
      - schema:
          default: asc
          type: string
          enum:
          - asc
          - desc
          - ASC
          - DESC
        in: query
        name: order
        required: false
      - schema:
          type: string
        in: query
        name: name
        required: false
      - schema:
          type: number
        in: query
        name: hierarchyLevel
        required: false
      - schema:
          anyOf:
          - type: string
          - type: 'null'
        in: query
        name: parentId
        required: false
      - schema:
          anyOf:
          - type: string
          - type: boolean
        in: query
        name: hasParentId
        required: false
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      success:
                        default: true
                        type: boolean
                      pagination:
                        type: object
                        properties:
                          page:
                            default: 1
                            type: number
                          limit:
                            default: 10
                            type: number
                          total:
                            default: 0
                            type: number
                          totalPages:
                            default: 0
                            type: number
                        required:
                        - page
                        - limit
                        - total
                        - totalPages
                        additionalProperties: false
                    required:
                    - success
                    additionalProperties: false
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                        name:
                          type: string
                          maxLength: 255
                        parentId:
                          anyOf:
                          - type: string
                          - type: 'null'
                        quantityUnits:
                          anyOf:
                          - type: array
                            items:
                              type: string
                          - type: 'null'
                        weightUnits:
                          anyOf:
                          - type: array
                            items:
                              type: string
                          - type: 'null'
                        isWeightAvailable:
                          anyOf:
                          - type: boolean
                          - type: 'null'
                        assetId:
                          anyOf:
                          - type: string
                          - type: 'null'
                        assetType:
                          anyOf:
                          - type: string
                            maxLength: 4000
                          - type: 'null'
                        hierarchyLevel:
                          anyOf:
                          - type: number
                          - type: 'null'
                        createdAt:
                          anyOf:
                          - type: string
                            format: date-time
                          - type: 'null'
                        createdByUserId:
                          anyOf:
                          - type: string
                            maxLength: 36
                          - type: 'null'
                        createdByCompanyId:
                          anyOf:
                          - type: string
                            maxLength: 36
                          - type: 'null'
                        updatedAt:
                          anyOf:
                          - type: string
                            format: date-time
                          - type: 'null'
                        updatedByUserId:
                          anyOf:
                          - type: string
                            maxLength: 36
                          - type: 'null'
                        updatedByCompanyId:
                          anyOf:
                          - type: string
                            maxLength: 36
                          - type: 'null'
                      required:
                      - id
                      - name
                      - parentId
                      - quantityUnits
                      - weightUnits
                      - isWeightAvailable
                      - assetId
                      - assetType
                      - hierarchyLevel
                      additionalProperties: false
                required:
                - metadata
                - data
                additionalProperties: false
      summary: Get api style types
      x-summary-source: derived
      operationId: getApiV2StyleTypes
      x-operation-id-source: derived
