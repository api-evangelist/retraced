            format: date-time
          - type: 'null'
        updatedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        createdByImpersonateId:
          anyOf:
          - type: string
            maxLength: 36
          - type: 'null'
        createdByUserId:
          anyOf:
          - type: string
            maxLength: 36
          - type: 'null'
        createdByCompanyId:
          anyOf:
          - type: string
            maxLength: 36
          - type: 'null'
        createdByApiKeyId:
          anyOf:
          - type: string
            maxLength: 36
          - type: 'null'
        createdByApiKeyLabel:
          anyOf:
          - type: string
