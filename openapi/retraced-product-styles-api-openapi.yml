  /api/v2/styles/archive:
    post:
      tags:
      - Product / Styles
      description: Archive one or more styles, variants, or SKUs. All IDs must belong to the same product level. Archiving a style cascades to all its child variants and SKUs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  description: Array of IDs to archive or unarchive. Max 100. All IDs must belong to the same product level (style, variant, or SKU).
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                shouldUnarchiveChildren:
                  description: Whether to cascade the operation to child variants and SKUs. Defaults to true.
                  default: true
                  type: boolean
              required:
              - ids
      responses:
        '204':
          description: No content
  /api/v2/styles/unarchive:
    post:
      tags:
      - Product / Styles
      description: Unarchive one or more styles, variants, or SKUs. All IDs must belong to the same product level.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  description: Array of IDs to archive or unarchive. Max 100. All IDs must belong to the same product level (style, variant, or SKU).
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                shouldUnarchiveChildren:
                  description: Whether to cascade the operation to child variants and SKUs. Defaults to true.
                  default: true
                  type: boolean
              required:
              - ids
      responses:
        '204':
          description: No content
