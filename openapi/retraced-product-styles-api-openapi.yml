                        anyOf:
                        - type: boolean
                        - type: 'null'
                      recyclabilityCanBeSorted:
                        description: True if the product can be sorted at recycling facilities.
                        anyOf:
                        - type: boolean
                        - type: 'null'
                      recyclabilityCanCollectAtScale:
