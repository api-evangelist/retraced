                  anyOf:
                  - type: array
                    items:
                      type: string
                      minLength: 1
                  - type: 'null'
                imagesFileIds:
                  description: Array of file IDs for product images, obtained via the Files API.
                  anyOf:
                  - type: array
                    items:
                      type: string
                      minLength: 1
                  - type: 'null'
                ecoFootPrint:
                  description: Sustainability and recyclability data for this product.
                  anyOf:
                  - type: object
                    properties:
                      hazardousMaterials:
                        description: List of hazardous substances present in the product.
                        anyOf:
                        - type: array
                          items:
                            type: object
                            properties:
                              idx:
