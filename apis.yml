aid: retraced
name: Retraced
description: >-
  Retraced is an AI-first supply chain transparency and compliance platform for the
  fashion and textile industry. It helps brands and suppliers manage multi-tier
  traceability (fiber to finish), certified-materials validation, material composition,
  Digital Product Passports, supplier collaboration, and regulatory compliance across
  frameworks such as CSDDD, AGEC, and LKSG. Retraced exposes a versioned Public API v2
  for machine-to-machine access to products (styles), bills of materials, material
  composition, certificates, companies with ESG data, supply chains, files, and Order Hub
  purchase/sales orders — the same data model that powers the Retraced dashboard. Backed
  by Partech.
